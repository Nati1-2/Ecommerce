version: '3.8'

services:
  mongodb:
    image: mongo:7.0-nanoserver
    container_name: ecom_prod_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password123}
    volumes:
      - mongo_prod_data:/data/db
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7.2-alpine
    container_name: ecom_prod_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    deploy:
      resources:
        limits:
          memory: 128M

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ecom_prod_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    deploy:
      resources:
        limits:
          memory: 256M

  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    container_name: ecom_prod_api_gateway
    restart: always
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      AUTH_SERVICE_URL: http://auth-service:8001
      USER_SERVICE_URL: http://user-service:8002
      PRODUCT_SERVICE_URL: http://product-service:8003
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-2026}
    depends_on:
      - auth-service
      - user-service
      - product-service
    deploy:
      resources:
        limits:
          memory: 128M

  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    container_name: ecom_prod_auth_service
    restart: always
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-password123}@mongodb:27017/auth_db?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-2026}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
    depends_on:
      - mongodb
      - rabbitmq
    deploy:
      resources:
        limits:
          memory: 256M

  user-service:
    build:
      context: ../services/user-service
      dockerfile: Dockerfile
    container_name: ecom_prod_user_service
    restart: always
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-password123}@mongodb:27017/user_db?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-2026}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
    depends_on:
      - mongodb
      - rabbitmq
    deploy:
      resources:
        limits:
          memory: 256M

  product-service:
    build:
      context: ../services/product-service
      dockerfile: Dockerfile
    container_name: ecom_prod_product_service
    restart: always
    ports:
      - "8003:8003"
    environment:
      PORT: 8003
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-password123}@mongodb:27017/product_db?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-2026}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
    depends_on:
      - mongodb
      - rabbitmq
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  mongo_prod_data:
  redis_prod_data:
