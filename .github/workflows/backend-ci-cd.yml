name: Backend Microservices CI Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  backend-test:
    name: Backend Test & Compilation Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Build Shared Library
        run: npm run build:shared

      - name: Compile Microservices (TypeScript)
        run: npm run build:services

      - name: Audit Dependency Vulnerabilities
        run: npm audit --audit-level=high || true

      - name: Run Microservices Unit Tests
        run: |
          cd services/auth-service && npm run test || true
          cd ../user-service && npm run test || true
          cd ../product-service && npm run test || true
          cd ../vendor-service && npm run test || true
