name: Continuous Integration (CI)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Code Quality, Security & Automated Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 📦 Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: 🏗️ Backend Services Compilation Check
        working-directory: ./backend
        run: npm run build:services

      - name: 🧪 Run Automated Unit, Integration & Security Tests
        run: node --test --experimental-strip-types tests/unit/*.test.ts tests/integration/*.test.ts tests/security/*.test.ts

      - name: 🔍 TypeScript Type Check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: 🧹 Linting Check
        working-directory: ./frontend
        run: npm run lint

      - name: 🔒 Secret Scanning Check
        run: |
          echo "Verifying no private keys or active secrets are committed..."
          ! grep -rn "sk_live_" . --exclude-dir=node_modules --exclude-dir=.git
          ! grep -rn "rootpassword" . --exclude-dir=node_modules --exclude-dir=.git

      - name: 🏗️ Production Frontend Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_APP_URL: https://natistore.vercel.app
          NEXT_PUBLIC_API_URL: https://natistore.vercel.app/api
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_sample
        run: npm run build
