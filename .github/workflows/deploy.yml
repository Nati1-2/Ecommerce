name: Production Deployment (CD)

on:
  workflow_run:
    workflows: ["Continuous Integration (CI)"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require successful CI on main
        env:
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$CI_CONCLUSION" != "success" ] || [ "$CI_BRANCH" != "main" ]; then
            echo "::error::Production deployment requires successful CI on main"
            exit 1
          fi

      - name: Check required deployment secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Required deployment secret ${name} is missing"
              exit 1
            fi
          done

      - name: Checkout the commit validated by CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify checkout and current main
        env:
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CI_SHA"
          test "$(git ls-remote https://github.com/${{ github.repository }}.git refs/heads/main | cut -f1)" = "$CI_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy the validated commit
        id: vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          url=$(vercel deploy --prod --yes --token "$VERCEL_TOKEN" --build-env NEXT_PUBLIC_DEPLOYMENT_COMMIT="$CI_SHA")
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify production health and commit
        env:
          DEPLOYMENT_URL: ${{ steps.vercel.outputs.url }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          response=$(curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 30 "$DEPLOYMENT_URL/api/health")
          echo "$response" | jq -e --arg sha "$CI_SHA" '.status == "healthy" and .mongodb == "connected" and .commit == $sha'

      - name: Report verified deployment
        env:
          DEPLOYMENT_URL: ${{ steps.vercel.outputs.url }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "### Verified production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $CI_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
